name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"

      - name: Synchronize frozen dependencies
        timeout-minutes: 15
        run: uv sync --frozen

      - name: Validate Stage 7 workflow and pipeline
        timeout-minutes: 10
        run: uv run pytest tests/workflows tests/pipeline/test_daily_schemas.py tests/pipeline/test_daily_cache.py tests/pipeline/test_daily_artifacts.py tests/pipeline/test_daily.py tests/pipeline/test_daily_cli.py -q

      - name: Validate Stage 9 offline budgets
        timeout-minutes: 10
        run: uv run pytest tests/benchmarks tests/observability tests/workflows/test_stage9_ci.py -q

      - name: Run Pytest
        timeout-minutes: 30
        run: |
          uv run pytest -m "" --cov=src/zotero_arxiv_daily --cov-report=term-missing

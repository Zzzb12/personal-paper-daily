name: Personal Paper Daily

on:
  workflow_dispatch:
    inputs:
      live_run:
        description: Run Zotero, arXiv, PDF, and LLM stages
        required: false
        default: false
        type: boolean
      send_feishu:
        description: Send the validated digest to Feishu
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 22 * * *"

permissions:
  contents: read

concurrency:
  group: personal-paper-daily-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      pages_ready: ${{ steps.review.outputs.pages_ready }}
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4
        with:
          version: "0.11.29"
          enable-cache: false

      - name: Synchronize frozen dependencies
        timeout-minutes: 15
        run: uv sync --frozen

      - name: Restore version-matched safe caches
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            cache/embeddings
            cache/documents
            models/docling
            models/reranker
          key: personal-paper-daily-stage9-v1-${{ runner.os }}-${{ hashFiles('uv.lock', 'config/base.yaml', 'src/zotero_arxiv_daily/**/*.py') }}-${{ vars.LLM_MODEL }}

      - name: Restore append-only delivery ledger
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: cache/workflow/delivery-ledger.json
          key: personal-paper-daily-delivery-stage7-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            personal-paper-daily-delivery-stage7-v1-${{ runner.os }}-

      - name: Prepare version-declared live models
        if: ${{ (github.event_name == 'schedule' && vars.PAPER_DAILY_SCHEDULE_LIVE == 'I_UNDERSTAND_LIVE_NETWORK') || (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch && inputs.live_run && vars.PAPER_DAILY_MANUAL_LIVE == 'I_UNDERSTAND_LIVE_NETWORK') }}
        timeout-minutes: 30
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [[ -z "$HF_TOKEN" ]]; then
            echo "::error::missing required live model secret: HF_TOKEN"
            exit 2
          fi
          uv run docling-tools models download layout tableformer --output-dir models/docling --quiet
          uv run python -m zotero_arxiv_daily.pipeline.model_preflight --config-dir config

      - name: Run daily pipeline
        timeout-minutes: 70
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_LIVE_REQUEST: ${{ inputs.live_run }}
          MANUAL_SEND_REQUEST: ${{ inputs.send_feishu }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SCHEDULE_LIVE_ACK: ${{ vars.PAPER_DAILY_SCHEDULE_LIVE }}
          SCHEDULE_SEND_ACK: ${{ vars.PAPER_DAILY_SCHEDULE_SEND }}
          MANUAL_LIVE_ACK: ${{ vars.PAPER_DAILY_MANUAL_LIVE }}
          MANUAL_SEND_ACK: ${{ vars.PAPER_DAILY_MANUAL_SEND }}
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          PAPER_DAILY_SITE_URL: ${{ vars.PAPER_DAILY_SITE_URL }}
        run: |
          trigger="scheduled"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            trigger="manual"
          fi

          mode="dry-run"
          fixture_args=(--offline-fixture tests/fixtures/evidence/stage4_golden.json)
          send_args=()

          if [[ "$EVENT_NAME" == "schedule" && "$SCHEDULE_LIVE_ACK" == "I_UNDERSTAND_LIVE_NETWORK" ]]; then
            mode="live"
            fixture_args=()
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REF_NAME" == "$DEFAULT_BRANCH" && "$MANUAL_LIVE_REQUEST" == "true" && "$MANUAL_LIVE_ACK" == "I_UNDERSTAND_LIVE_NETWORK" ]]; then
            mode="live"
            fixture_args=()
          fi

          if [[ "$mode" == "live" && "$EVENT_NAME" == "schedule" && "$SCHEDULE_SEND_ACK" == "I_UNDERSTAND_FEISHU_SEND" ]]; then
            send_args=(--send-feishu)
          elif [[ "$mode" == "live" && "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_SEND_REQUEST" == "true" && "$MANUAL_SEND_ACK" == "I_UNDERSTAND_FEISHU_SEND" ]]; then
            send_args=(--send-feishu)
          fi

          uv run python -m zotero_arxiv_daily.pipeline.daily \
            --trigger "$trigger" \
            --mode "$mode" \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --run-root outputs/daily \
            --viewer-output viewer \
            --manifest-output run-manifest.json \
            "${fixture_args[@]}" \
            "${send_args[@]}"

      - name: Verify reviewed viewer artifact
        id: review
        timeout-minutes: 5
        shell: bash
        run: |
          uv run python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          from zotero_arxiv_daily.pipeline.artifacts import ArtifactAuditor
          from zotero_arxiv_daily.pipeline.daily_schemas import RunManifest

          run_root = Path("outputs/daily")
          manifest = RunManifest.model_validate_json(
              (run_root / "run-manifest.json").read_text(encoding="utf-8")
          )
          metrics_path = run_root / "run-metrics.json"
          if manifest.metrics.status == "success":
              metrics_payload = metrics_path.read_bytes()
              if hashlib.sha256(metrics_payload).hexdigest() != manifest.metrics.sidecar_hash:
                  raise SystemExit("run metrics hash differs from the run manifest")
          elif metrics_path.exists():
              raise SystemExit("unsuccessful metrics result must not expose a sidecar")
          core_failed = any(
              stage.status == "failed" and stage.name != "feishu"
              for stage in manifest.stages
          )
          pages_ready = (
              manifest.status in {"success", "partial"}
              and not core_failed
              and manifest.static_site.status == "success"
              and manifest.counts.published_count > 0
          )
          if pages_ready:
              audit = ArtifactAuditor(run_root).audit(Path("viewer"))
              if audit.artifact_hash != manifest.artifact_hash:
                  raise SystemExit("reviewed artifact hash differs from the run manifest")
              if audit.build_manifest.published_count != manifest.counts.published_count:
                  raise SystemExit("reviewed publication count differs from the run manifest")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"pages_ready={'true' if pages_ready else 'false'}\n")
          PY

      - name: Upload safe private run records
        if: ${{ always() && hashFiles('outputs/daily/run-manifest.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: personal-paper-daily-run-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            outputs/daily/run-manifest.json
            outputs/daily/run-metrics.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload reviewed Pages artifact
        if: ${{ steps.review.outputs.pages_ready == 'true' }}
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: outputs/daily/viewer
          retention-days: 1

  deploy:
    if: ${{ vars.PAPER_DAILY_ENABLE_PAGES_DEPLOY == 'I_UNDERSTAND_PUBLIC_ARTIFACT' && needs.daily.outputs.pages_ready == 'true' }}
    needs: daily
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
